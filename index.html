<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qibla Kompass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
        }
        .dial-rotate {
            transition: transform 0.1s cubic-bezier(0.1, 0.7, 0.1, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-5 select-none overflow-hidden">

    <!-- Top Status -->
    <header class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-4 flex justify-between items-center shadow-lg">
        <div>
            <h1 class="text-xs uppercase tracking-wider text-emerald-400 font-semibold">Qibla Kompass</h1>
            <p id="location-status" class="text-sm text-slate-300 font-medium mt-0.5">GPS wird ermittelt...</p>
        </div>
        <button id="permission-btn" onclick="requestSensors()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3.5 py-2 rounded-xl font-medium transition shadow-sm">
            Sensor starten
        </button>
    </header>

    <!-- Main Compass Rose Centerpiece -->
    <main class="w-full max-w-sm flex-1 flex flex-col items-center justify-center relative my-auto">

        <!-- Desktop Notice -->
        <div id="desktop-warning" class="hidden absolute top-0 left-0 right-0 bg-amber-500/10 border border-amber-500/30 text-amber-200 p-3 rounded-xl text-xs text-center z-30">
            Hinweis: Kein Kompass-Sensor gefunden. Bitte auf einem Smartphone öffnen.
        </div>

        <!-- Rotating Compass Rose Container -->
        <div class="relative w-76 h-76 sm:w-84 sm:h-84 flex items-center justify-center">

            <!-- Outer Fixed Ring -->
            <div class="absolute inset-0 rounded-full border-2 border-slate-800 bg-slate-900/90 shadow-2xl flex items-center justify-center pointer-events-none">
                <!-- Fixed Top Indicator (Phone Front) -->
                <div class="absolute top-2 w-1.5 h-4 bg-red-500 rounded-full z-20 shadow-md"></div>
            </div>

            <!-- Rotating Compass Rose Disk (Rotates opposite to device heading so North points North) -->
            <div id="compass-disk" class="absolute inset-3 rounded-full border border-slate-700/60 dial-rotate flex items-center justify-center">
                
                <!-- Compass Rose Points -->
                <span class="absolute top-2 text-sm font-bold text-red-500 tracking-widest">N</span>
                <span class="absolute bottom-2 text-xs font-semibold text-slate-400 tracking-widest">S</span>
                <span class="absolute left-2 text-xs font-semibold text-slate-400 tracking-widest">W</span>
                <span class="absolute right-2 text-xs font-semibold text-slate-400 tracking-widest">O</span>

                <span class="absolute top-6 left-12 text-[10px] text-slate-500 font-medium">NW</span>
                <span class="absolute top-6 right-12 text-[10px] text-slate-500 font-medium">NO</span>
                <span class="absolute bottom-6 left-12 text-[10px] text-slate-500 font-medium">SW</span>
                <span class="absolute bottom-6 right-12 text-[10px] text-slate-500 font-medium">SO</span>

                <!-- Degree Ticks Ring -->
                <div class="absolute inset-6 rounded-full border border-dashed border-slate-800"></div>

                <!-- Qibla Direction Marker Line on the Compass Rose -->
                <div id="qibla-marker" class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div class="absolute w-1 h-[78%] bg-emerald-500/30 rounded-full flex flex-col justify-between items-center py-4">
                        <div class="w-3 h-3 bg-emerald-400 rounded-full shadow-lg shadow-emerald-500/50 flex items-center justify-center">
                            <svg class="w-2 h-2 text-slate-950" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2z"/></svg>
                        </div>
                        <div class="w-2 h-2 bg-emerald-500/50 rounded-full"></div>
                    </div>
                </div>

            </div>

            <!-- Center Hub / Kaaba Indicator -->
            <div id="center-hub" class="w-14 h-14 rounded-full bg-slate-900 border-2 border-slate-700 flex items-center justify-center z-10 shadow-xl transition-colors duration-300">
                <svg class="w-6 h-6 text-slate-300 transition-colors duration-300" id="hub-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 5h2v5h-2z"/>
                </svg>
            </div>

        </div>

        <!-- Info Cards -->
        <div class="w-full mt-6 grid grid-cols-2 gap-3">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 text-center shadow-md">
                <span class="text-[11px] text-slate-400 font-medium uppercase tracking-wider block">Ausrichtung</span>
                <span id="heading-display" class="text-base font-bold text-slate-100 font-mono mt-0.5 block">0° N</span>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 text-center shadow-md">
                <span class="text-[11px] text-slate-400 font-medium uppercase tracking-wider block">Qibla Richtung</span>
                <span id="qibla-angle-val" class="text-base font-bold text-emerald-400 font-mono mt-0.5 block">--°</span>
            </div>
        </div>

        <!-- Instruction Text -->
        <p id="direction-instruction" class="text-xs text-slate-400 text-center mt-4 font-medium">
            Drehe das Smartphone, bis die grüne Kaaba-Markierung nach oben zeigt.
        </p>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-3 flex justify-between items-center text-xs text-slate-400 shadow-md">
        <span>Ziel: Kaaba (Mekka)</span>
        <span>GPS: <span id="accuracy-val" class="text-slate-200">--</span></span>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const MECCA_LAT = 21.4225;
        const MECCA_LNG = 39.8262;

        let userLat = null;
        let userLng = null;
        let qiblaAngle = 0;
        let currentHeading = 0;
        let isAligned = false;

        const locationStatusEl = document.getElementById('location-status');
        const permissionBtn = document.getElementById('permission-btn');
        const compassDisk = document.getElementById('compass-disk');
        const qiblaMarker = document.getElementById('qibla-marker');
        const centerHub = document.getElementById('center-hub');
        const hubIcon = document.getElementById('hub-icon');
        const headingDisplay = document.getElementById('heading-display');
        const qiblaAngleVal = document.getElementById('qibla-angle-val');
        const accuracyVal = document.getElementById('accuracy-val');
        const desktopWarning = document.getElementById('desktop-warning');
        const directionInstruction = document.getElementById('direction-instruction');

        window.addEventListener('DOMContentLoaded', () => {
            initLocation();
            checkSensors();
        });

        function initLocation() {
            if (!navigator.geolocation) {
                locationStatusEl.textContent = "GPS wird nicht unterstützt";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    const acc = pos.coords.accuracy;

                    accuracyVal.textContent = `±${Math.round(acc)}m`;
                    qiblaAngle = calculateQibla(userLat, userLng);
                    qiblaAngleVal.textContent = `${Math.round(qiblaAngle)}°`;
                    locationStatusEl.textContent = "GPS aktiv";

                    // Position the Qibla marker on the compass disk
                    qiblaMarker.style.transform = `rotate(${qiblaAngle}deg)`;
                },
                (err) => {
                    console.warn(err);
                    locationStatusEl.textContent = "Standort verweigert";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function calculateQibla(lat, lng) {
            const phiK = MECCA_LAT * Math.PI / 180.0;
            const lambdaK = MECCA_LNG * Math.PI / 180.0;
            const phi = lat * Math.PI / 180.0;
            const lambda = lng * Math.PI / 180.0;

            const y = Math.sin(lambdaK - lambda);
            const x = Math.cos(phi) * Math.tan(phiK) - Math.sin(phi) * Math.cos(lambdaK - lambda);
            
            let qibla = Math.atan2(y, x) * 180.0 / Math.PI;
            return (qibla + 360) % 360;
        }

        function checkSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                permissionBtn.classList.remove('hidden');
            } else if ('ondeviceorientationabsolute' in window || 'ondeviceorientation' in window) {
                startCompass();
            } else {
                desktopWarning.classList.remove('hidden');
                locationStatusEl.textContent = "Kein Kompass-Sensor";
            }
        }

        function requestSensors() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(res => {
                        if (res === 'granted') {
                            permissionBtn.classList.add('hidden');
                            startCompass();
                        } else {
                            alert("Berechtigung für Sensoren verweigert.");
                        }
                    })
                    .catch(console.error);
            }
        }

        function startCompass() {
            const eventName = 'ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation';
            window.addEventListener(eventName, handleOrientation, true);
            locationStatusEl.textContent = "Kompass aktiv";
        }

        function handleOrientation(e) {
            let heading = null;

            if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
                heading = e.webkitCompassHeading;
            } else if (e.alpha !== null) {
                heading = 360 - e.alpha;
            }

            if (heading !== null) {
                currentHeading = heading;
                updateCompass();
            }
        }

        function updateCompass() {
            const cardinals = ["N", "NO", "O", "SO", "S", "SW", "W", "NW"];
            const idx = Math.round((currentHeading % 360) / 45) % 8;
            headingDisplay.textContent = `${Math.round(currentHeading)}° ${cardinals[idx]}`;

            // Rotate the entire compass disk counter-clockwise by heading so North points to real North
            compassDisk.style.transform = `rotate(${-currentHeading}deg)`;

            // Check if device is pointing towards Qibla
            // Net angle of Qibla marker relative to top of phone = (qiblaAngle - currentHeading)
            let diff = Math.abs(qiblaAngle - currentHeading);
            if (diff > 180) diff = 360 - diff;

            if (diff <= 3) {
                if (!isAligned) {
                    isAligned = true;
                    centerHub.style.borderColor = '#10B981';
                    centerHub.style.background = '#064e3b';
                    hubIcon.style.color = '#34d399';
                    directionInstruction.textContent = "✓ Exakt in Richtung Kaaba!";
                    directionInstruction.className = "text-xs text-emerald-400 font-bold text-center mt-4";
                    if (navigator.vibrate) navigator.vibrate([60, 60, 60]);
                }
            } else {
                if (isAligned) {
                    isAligned = false;
                    centerHub.style.borderColor = '';
                    centerHub.style.background = '';
                    hubIcon.style.color = '';
                    directionInstruction.textContent = "Drehe das Smartphone, bis die grüne Kaaba-Markierung nach oben zeigt.";
                    directionInstruction.className = "text-xs text-slate-400 text-center mt-4 font-medium";
                }
            }
        }
    </script>
</body>
</html>
