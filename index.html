    <!-- JavaScript Application Logic -->
    <script>
        // ============ CONSTANTS & CONFIGURATION ============
        const MECCA_LAT = 21.4225;
        const MECCA_LNG = 39.8262;
        const SMOOTHING_ALPHA = 0.15; // Lower = smoother, but slower response
        const ALIGNMENT_TOLERANCE = 3; // degrees
        const HEADING_SAMPLE_RATE = 50; // ms between updates

        // ============ STATE VARIABLES ============
        let userLat = null;
        let userLng = null;
        let qiblaAngle = 0;
        let currentHeading = 0;
        let smoothedHeading = 0;
        let isAligned = false;
        let sensorStatus = { gps: false, compass: false, orientation: false };
        let lastHeadingTime = 0;

        // ============ DOM ELEMENTS ============
        const locationStatusEl = document.getElementById('location-status');
        const permissionBtn = document.getElementById('permission-btn');
        const compassRose = document.getElementById('compass-rose');
        const qiblaNeedle = document.getElementById('qibla-needle');
        const needleHead = document.getElementById('needle-head');
        const needleBody = document.getElementById('needle-body');
        const headingDisplay = document.getElementById('heading-display');
        const qiblaAngleVal = document.getElementById('qibla-angle-val');
        const accuracyVal = document.getElementById('accuracy-val');
        const desktopWarning = document.getElementById('desktop-warning');
        const calibrationWarning = document.getElementById('calibration-warning');
        const directionInstruction = document.getElementById('direction-instruction');
        const gpsIndicator = document.getElementById('gps-indicator');
        const sensorIndicator = document.getElementById('sensor-indicator');

        // ============ INITIALIZATION ============
        window.addEventListener('DOMContentLoaded', () => {
            // Check for secure context / HTTPS requirement on iOS
            if (!window.isSecureContext && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1' && window.location.protocol !== 'file:') {
                desktopWarning.textContent = "iPhone requires HTTPS for location and compass.";
                desktopWarning.classList.remove('hidden');
            }
            
            // Allow clicking location status to retry GPS
            locationStatusEl.parentElement.style.cursor = 'pointer';
            locationStatusEl.parentElement.title = "Tap to search for your location again";
            locationStatusEl.parentElement.onclick = () => {
                locationStatusEl.textContent = "Searching for your location again ...";
                initLocation();
            };

            initLocation();
            checkSensors();
            registerServiceWorker();
        });

        // ============ SERVICE WORKER (PWA SUPPORT) ============
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(`
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('activate', e => self.clients.claim());
                    self.addEventListener('fetch', e => {
                        e.respondWith(
                            caches.match(e.request).then(r => r || fetch(e.request)).catch(() => new Response('Offline'))
                        );
                    });
                `)).catch(() => {});
            }
        }

        // ============ GEOLOCATION & QIBLA CALCULATION ============
        function initLocation() {
            if (!navigator.geolocation) {
                locationStatusEl.textContent = "Location unavailable";
                useDefaultLocation("Location unavailable");
                return;
            }

            // Fallback timer for GPS timeout on iPhone indoors
            let gpsTimeout = setTimeout(() => {
                if (!userLat || !userLng) {
                    useDefaultLocation("GPS weak - using default");
                }
            }, 7000);

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    clearTimeout(gpsTimeout);
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    const acc = pos.coords.accuracy || 0;

                    accuracyVal.textContent = `±${Math.round(acc)}m`;
                    qiblaAngle = calculateQibla(userLat, userLng);
                    qiblaAngleVal.textContent = `${Math.round(qiblaAngle)}°`;
                    locationStatusEl.textContent = "Location found";
                    updateGPSIndicator(true);
                    updateCompass();

                    // Watch position for continuous updates
                    navigator.geolocation.watchPosition(
                        (p) => {
                            userLat = p.coords.latitude;
                            userLng = p.coords.longitude;
                            qiblaAngle = calculateQibla(userLat, userLng);
                            qiblaAngleVal.textContent = `${Math.round(qiblaAngle)}°`;
                            accuracyVal.textContent = `±${Math.round(p.coords.accuracy || 0)}m`;
                            updateCompass();
                        },
                        (e) => console.warn(e),
                        { enableHighAccuracy: true, maximumAge: 10000 }
                    );
                },
                (err) => {
                    clearTimeout(gpsTimeout);
                    console.warn(err);
                    let msg = err.code === 1 ? "Location denied" : "Location not found";
                    locationStatusEl.textContent = msg;
                    updateGPSIndicator(false);
                    useDefaultLocation(msg);
                },
                { enableHighAccuracy: true, timeout: 7000, maximumAge: 5000 }
            );
        }

        function useDefaultLocation(reason) {
            if (userLat && userLng) return;
            // Fallback default coordinates (e.g., Istanbul or user's region, or Mecca if none)
            userLat = 41.0082; 
            userLng = 28.9784;
            qiblaAngle = calculateQibla(userLat, userLng);
            qiblaAngleVal.textContent = `${Math.round(qiblaAngle)}° (Default)`;
            accuracyVal.textContent = `N/A`;
            locationStatusEl.textContent = reason;
            updateGPSIndicator(false);
            updateCompass();
        }

        function calculateQibla(lat, lng) {
            const phiK = MECCA_LAT * Math.PI / 180.0;
            const lambdaK = MECCA_LNG * Math.PI / 180.0;
            const phi = lat * Math.PI / 180.0;
            const lambda = lng * Math.PI / 180.0;

            const y = Math.sin(lambdaK - lambda);
            const x = Math.cos(phi) * Math.tan(phiK) - Math.sin(phi) * Math.cos(lambdaK - lambda);
            
            let qibla = Math.atan2(y, x) * 180.0 / Math.PI;
            qibla = (qibla + 360) % 360;

            // Approximate Magnetic Declination Correction (IGRF-based simplified model)
            // Magnetic North vs True North correction to prevent heading offsets
            const declination = getMagneticDeclination(lat, lng);
            return (qibla - declination + 360) % 360;
        }

        function getMagneticDeclination(lat, lng) {
            // Simplified World Magnetic Model estimation based on location
            // Europe/Middle East approximate declination polynomial estimation
            const latRad = lat * Math.PI / 180;
            const lngRad = lng * Math.PI / 180;
            // General empirical approximation for Eurasia / Middle East region
            let dec = 4.5 * Math.sin(lngRad) - 2.0 * Math.cos(latRad);
            if (isNaN(dec)) return 0;
            return dec;
        }

        // ============ SENSOR INITIALIZATION ============
        function checkSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                permissionBtn.classList.remove('hidden');
                updateSensorIndicator(false);
            } else if ('ondeviceorientationabsolute' in window || 'ondeviceorientation' in window) {
                startCompass();
            } else {
                // Try starting compass anyway for Android/iOS browsers that support orientation without explicit requestPermission API
                startCompass();
            }
        }

        function requestSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(res => {
                        if (res === 'granted') {
                            permissionBtn.classList.add('hidden');
                            startCompass();
                        } else {
                            alert("Compass permission was denied. Please check Safari settings.");
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        startCompass();
                    });
            } else {
                startCompass();
            }
        }

        function startCompass() {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            window.addEventListener('deviceorientation', handleOrientation, true);
            locationStatusEl.textContent = "Compass active";
            sensorStatus.compass = true;
            sensorStatus.orientation = true;
            updateSensorIndicator(true);
            permissionBtn.classList.add('hidden');
        }

        // ============ ORIENTATION HANDLING (TILT-COMPENSATED & SMOOTHED) ============
        function handleOrientation(e) {
            const now = Date.now();
            if (now - lastHeadingTime < HEADING_SAMPLE_RATE) return;
            lastHeadingTime = now;

            let heading = null;

            if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
                // iOS Safari direct compass heading
                heading = e.webkitCompassHeading;
            } else if (e.alpha !== null) {
                // Android & other devices: Apply 3D Tilt Compensation if beta and gamma are present
                if (e.beta !== null && e.gamma !== null) {
                    const alpha = e.alpha * Math.PI / 180;
                    const beta = e.beta * Math.PI / 180;
                    const gamma = e.gamma * Math.PI / 180;

                    const cA = Math.cos(alpha), sA = Math.sin(alpha);
                    const cB = Math.cos(beta), sB = Math.sin(beta);
                    const cG = Math.cos(gamma), sG = Math.sin(gamma);

                    // W3C DeviceOrientation tilt compensation formula
                    const vx = - cA * sG - sA * sB * cG;
                    const vy = - sA * sG + cA * sB * cG;

                    let compassHeading = Math.atan2(vx, vy) * (180 / Math.PI);
                    if (compassHeading < 0) compassHeading += 360;
                    heading = compassHeading;
                } else {
                    // Fallback heading calculation
                    heading = 360 - e.alpha;
                }
            }

            if (heading !== null) {
                // Apply exponential moving average (low-pass filter)
                smoothedHeading = smoothHeading(heading, smoothedHeading, SMOOTHING_ALPHA);
                currentHeading = smoothedHeading;
                updateCompass();

                // Detect poor calibration / magnetic interference (high variance)
                const variance = Math.abs(heading - smoothedHeading);
                if (variance > 25) {
                    calibrationWarning.classList.remove('hidden');
                    calibrationWarning.style.cursor = 'pointer';
                    calibrationWarning.title = "Tap to dismiss / recalibrate";
                    calibrationWarning.onclick = () => {
                        smoothedHeading = heading;
                        calibrationWarning.classList.add('hidden');
                    };
                } else {
                    calibrationWarning.classList.add('hidden');
                }
            }
        }

        function smoothHeading(newHeading, prevHeading, alpha) {
            let diff = newHeading - prevHeading;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            return (prevHeading + alpha * diff + 360) % 360;
        }

        // ============ COMPASS UPDATE & DISPLAY ============
        function updateCompass() {
            if (!userLat || !userLng) return;

            const cardinals = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
            const idx = Math.round((currentHeading % 360) / 45) % 8;
            headingDisplay.textContent = `${Math.round(currentHeading)}° ${cardinals[idx]}`;

            // Rotate compass rose
            compassRose.style.transform = `rotate(${-currentHeading}deg)`;

            // Rotate qibla needle to point directly at Mecca
            const needleRotation = qiblaAngle - currentHeading;
            qiblaNeedle.style.transform = `rotate(${needleRotation}deg)`;

            // Check alignment
            let diff = Math.abs(qiblaAngle - currentHeading);
            if (diff > 180) diff = 360 - diff;

            if (diff <= ALIGNMENT_TOLERANCE) {
                if (!isAligned) {
                    triggerSuccess();
                }
            } else {
                if (isAligned) {
                    resetSuccess();
                }
                const delta = ((qiblaAngle - currentHeading + 540) % 360) - 180;
                const turnText = Math.abs(Math.round(delta));
                directionInstruction.textContent = delta < 0
                    ? `Turn left ${turnText}°`
                    : `Turn right ${turnText}°`;
                directionInstruction.className = "text-base sm:text-lg text-white text-center mt-6 font-extrabold leading-relaxed max-w-xs drop-shadow-md bg-slate-900/80 px-4 py-3 rounded-2xl border border-emerald-500/40 shadow-xl";
            }
        }

        function triggerSuccess() {
            isAligned = true;
            needleHead.style.borderBottomColor = '#34d399';
            needleBody.style.backgroundColor = '#34d399';
            directionInstruction.textContent = "✓ You are facing the Qibla";
            directionInstruction.className = "text-base sm:text-lg text-emerald-300 font-black text-center mt-6 leading-relaxed max-w-xs drop-shadow-md bg-slate-900/90 px-4 py-3 rounded-2xl border border-emerald-500 shadow-xl";

            // Enhanced haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate([40, 30, 40, 30, 80]);
            }

            // Audio feedback
            playAlignmentTone();
        }

        function resetSuccess() {
            isAligned = false;
            needleHead.style.borderBottomColor = '';
            needleBody.style.backgroundColor = '';
            directionInstruction.textContent = "Hold your phone flat and follow the green arrow.";
            directionInstruction.className = "text-base sm:text-lg text-white text-center mt-6 font-extrabold leading-relaxed max-w-xs drop-shadow-md bg-slate-900/80 px-4 py-3 rounded-2xl border border-emerald-500/40 shadow-xl";
        }

        // ============ AUDIO FEEDBACK ============
        function playAlignmentTone() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();

                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

                osc.start(audioContext.currentTime);
                osc.stop(audioContext.currentTime + 0.3);
            } catch (e) {
                // Audio context not available, silently fail
            }
        }

        // ============ UI STATUS INDICATORS ============
        function updateGPSIndicator(active) {
            sensorStatus.gps = active;
            const span = gpsIndicator.querySelector('span');
            if (active) {
                span.textContent = "✓ Active";
                span.className = "text-emerald-400";
            } else {
                span.textContent = "✗ Waiting";
                span.className = "text-slate-300 pulse-subtle";
            }
        }

        function updateSensorIndicator(active) {
            sensorStatus.orientation = active;
            const span = sensorIndicator.querySelector('span');
            if (active) {
                span.textContent = "✓ Ready";
                span.className = "text-emerald-400";
            } else {
                span.textContent = "✗ Waiting";
                span.className = "text-slate-300 pulse-subtle";
            }
        }
    </script>
</body>
</html>
